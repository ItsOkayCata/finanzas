<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#F6F4EF">
<title>Finanzas — tu balance del mes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EF;
    --paper-raised:#FFFFFF;
    --ink:#1E2A24;
    --ink-soft:#66766C;
    --ink-faint:#9AA69C;
    --line:#E1DACB;
    --emerald:#2F6F52;
    --emerald-soft:#E4EEE7;
    --gold:#B8933D;
    --gold-soft:#F3ECD8;
    --wine:#7C3A4D;
    --wine-soft:#F1E3E6;
    --radius:18px;
    --shadow:0 1px 2px rgba(30,42,36,0.04), 0 8px 24px -12px rgba(30,42,36,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
    min-height:100vh;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 18px;}

  /* Header */
  header{padding:28px 18px 8px;max-width:520px;margin:0 auto;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 4px;
  }
  h1.brand{
    font-family:'Fraunces',serif;font-weight:480;font-optical-sizing:auto;
    font-size:30px;margin:0 0 18px;letter-spacing:-.01em;
  }
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);
  }
  .month-nav button{
    background:none;border:none;color:var(--ink);cursor:pointer;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;
  }
  .month-nav button:hover{background:var(--emerald-soft);}
  .month-nav button:active{transform:scale(.94);}
  .month-label{font-family:'Fraunces',serif;font-size:16px;font-weight:600;text-transform:capitalize;}

  /* Cards */
  .card{
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;margin-top:16px;
  }
  .card h2{
    font-family:'Fraunces',serif;font-size:15px;font-weight:600;
    margin:0 0 14px;color:var(--ink);
  }

  /* Add form */
  .toggle{
    display:flex;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:4px;gap:4px;
  }
  .toggle button{
    flex:1;border:none;background:none;padding:10px 0;border-radius:9px;
    font-family:'Inter';font-weight:600;font-size:14px;color:var(--ink-soft);
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .15s,color .15s;
  }
  .toggle button.active.income{background:var(--emerald);color:#fff;}
  .toggle button.active.expense{background:var(--wine);color:#fff;}

  .amount-row{
    display:flex;align-items:baseline;gap:6px;margin:18px 0 4px;
    border-bottom:1px solid var(--line);padding-bottom:10px;
  }
  .amount-row span{font-family:'Fraunces',serif;font-size:22px;color:var(--ink-faint);}
  .amount-row input{
    border:none;outline:none;background:none;font-family:'Fraunces',serif;
    font-size:34px;font-weight:600;color:var(--ink);width:100%;font-variant-numeric:tabular-nums;
  }
  .amount-row input::placeholder{color:var(--ink-faint);}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
  .chip{
    font-family:'Inter';font-size:13px;font-weight:500;padding:7px 13px;
    border-radius:99px;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-soft);cursor:pointer;transition:.15s;
  }
  .chip.active.income{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .chip.active.expense{background:var(--wine);border-color:var(--wine);color:#fff;}

  .field-row{display:flex;gap:10px;margin-top:12px;}
  .field{flex:1;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;letter-spacing:.05em;text-transform:uppercase;}
  .field input{
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;
    font-family:'Inter';font-size:14px;background:var(--paper);color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--gold);outline-offset:1px;}

  .save-btn{
    width:100%;margin-top:16px;border:none;border-radius:12px;padding:14px;
    font-family:'Inter';font-weight:600;font-size:15px;color:#fff;cursor:pointer;
    background:var(--ink);transition:.15s;
  }
  .save-btn:active{transform:scale(.98);}
  .save-btn.income{background:var(--emerald);}
  .save-btn.expense{background:var(--wine);}

  /* Report / ring */
  .report-top{display:flex;align-items:center;gap:20px;}
  .ring-wrap{position:relative;width:132px;height:132px;flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
  }
  .ring-pct{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
  .ring-sub{font-size:10px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

  .stat-list{flex:1;display:flex;flex-direction:column;gap:10px;}
  .stat-line{display:flex;justify-content:space-between;align-items:baseline;}
  .stat-line .lbl{font-size:13px;color:var(--ink-soft);}
  .stat-line .val{font-family:'Fraunces',serif;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;}
  .val.income{color:var(--emerald);}
  .val.expense{color:var(--wine);}

  .stitch{
    border:none;border-top:1.5px dashed var(--line);margin:18px 0;
  }

  .cat-row{display:flex;flex-direction:column;gap:12px;}
  .cat-item .cat-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .cat-item .cat-top .name{color:var(--ink);font-weight:500;}
  .cat-item .cat-top .amt{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:12px;}
  .bar-bg{height:6px;border-radius:99px;background:var(--paper);overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;border-radius:99px;background:var(--wine);}

  /* History */
  .day-group{margin-bottom:6px;}
  .day-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;
  }
  .tx{
    display:flex;align-items:center;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .tx:last-child{border-bottom:none;}
  .tx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tx-dot.income{background:var(--emerald);}
  .tx-dot.expense{background:var(--wine);}
  .tx-mid{flex:1;min-width:0;}
  .tx-cat{font-size:14px;font-weight:500;}
  .tx-note{font-size:12px;color:var(--ink-faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-amt{font-family:'Fraunces',serif;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .tx-amt.income{color:var(--emerald);}
  .tx-amt.expense{color:var(--wine);}
  .tx-del{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;
    width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    border-radius:6px;
  }
  .tx-del:hover{background:var(--wine-soft);color:var(--wine);}

  .empty{
    text-align:center;padding:28px 10px;color:var(--ink-faint);font-size:13px;
  }
  .empty span{display:block;font-family:'Fraunces',serif;font-size:16px;color:var(--ink-soft);margin-bottom:4px;}

  footer{
    text-align:center;padding:26px 18px 8px;color:var(--ink-faint);
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;
  }
  ::selection{background:var(--gold-soft);}
</style>
</head>
<body>

<header>
  <p class="eyebrow" id="today-label">·</p>
  <h1 class="brand">Finanzas</h1>
  <div class="month-nav">
    <button id="prev-month" aria-label="Mes anterior">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="month-label" id="month-label">—</span>
    <button id="next-month" aria-label="Mes siguiente">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</header>

<div class="wrap">

  <!-- Add transaction -->
  <div class="card">
    <h2>Nuevo movimiento</h2>
    <div class="toggle">
      <button type="button" class="type-btn active income" data-type="income">Ingreso</button>
      <button type="button" class="type-btn expense" data-type="expense">Gasto</button>
    </div>

    <div class="amount-row">
      <span>S/</span>
      <input type="number" inputmode="decimal" id="amount" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="chips" id="cat-chips"></div>

    <div class="field-row">
      <div class="field">
        <label for="note">Nota</label>
        <input type="text" id="note" placeholder="Opcional">
      </div>
      <div class="field" style="max-width:150px;">
        <label for="date">Fecha</label>
        <input type="date" id="date">
      </div>
    </div>

    <button class="save-btn income" id="save-btn">Guardar ingreso</button>
  </div>

  <!-- Report -->
  <div class="card">
    <h2>Reporte del mes</h2>
    <div class="report-top">
      <div class="ring-wrap">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="56" fill="none" stroke="#E1DACB" stroke-width="12"/>
          <circle id="ring-fg" cx="66" cy="66" r="56" fill="none" stroke="#2F6F52" stroke-width="12" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86"/>
        </svg>
        <div class="ring-center">
          <div class="ring-pct" id="ring-pct">0%</div>
          <div class="ring-sub">ahorrado</div>
        </div>
      </div>
      <div class="stat-list">
        <div class="stat-line"><span class="lbl">Ingresos</span><span class="val income" id="stat-income">S/ 0.00</span></div>
        <div class="stat-line"><span class="lbl">Gastos</span><span class="val expense" id="stat-expense">S/ 0.00</span></div>
        <div class="stat-line"><span class="lbl">Balance</span><span class="val" id="stat-balance">S/ 0.00</span></div>
      </div>
    </div>

    <hr class="stitch">
    <h2 style="margin-bottom:12px;">Gastos por categoría</h2>
    <div class="cat-row" id="cat-breakdown"></div>
  </div>

  <!-- History -->
  <div class="card">
    <h2>Movimientos</h2>
    <div id="history"></div>
  </div>

</div>

<footer>Sigueme en ig @fabbzxa</footer>

<script>
const CATS = {
  income: ['Salario','Freelance','Inversiones','Regalo','Otro'],
  expense: ['Comida','Transporte','Vivienda','Ocio','Salud','Compras','Servicios','Otro']
};
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

let state = {
  type: 'income',
  category: CATS.income[0],
  transactions: [],
  viewDate: new Date()
};

const $ = (id) => document.getElementById(id);
const fmt = (n) => 'S/ ' + Number(n||0).toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2});
const todayISO = () => {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};

function setToday(){
  const d = new Date();
  $('today-label').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  $('date').value = todayISO();
}

function renderChips(){
  const wrap = $('cat-chips');
  wrap.innerHTML = '';
  CATS[state.type].forEach(cat => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip ' + state.type + (cat === state.category ? ' active' : '');
    b.textContent = cat;
    b.onclick = () => { state.category = cat; renderChips(); };
    wrap.appendChild(b);
  });
}

function setType(type){
  state.type = type;
  state.category = CATS[type][0];
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  const saveBtn = $('save-btn');
  saveBtn.className = 'save-btn ' + type;
  saveBtn.textContent = type === 'income' ? 'Guardar ingreso' : 'Guardar gasto';
  renderChips();
}

document.querySelectorAll('.type-btn').forEach(b => b.onclick = () => setType(b.dataset.type));

async function loadData(){
  try{
    const raw = localStorage.getItem('finanzas_transactions');
    state.transactions = raw ? JSON.parse(raw) : [];
  }catch(e){
    state.transactions = [];
  }
  render();
}

async function persist(){
  try{
    localStorage.setItem('finanzas_transactions', JSON.stringify(state.transactions));
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

$('save-btn').onclick = async () => {
  const amount = parseFloat($('amount').value);
  if(!amount || amount <= 0){ $('amount').focus(); return; }
  const tx = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    type: state.type,
    category: state.category,
    amount: amount,
    note: $('note').value.trim(),
    date: $('date').value || todayISO()
  };
  state.transactions.push(tx);
  await persist();
  $('amount').value = '';
  $('note').value = '';
  $('date').value = todayISO();
  render();
};

async function deleteTx(id){
  state.transactions = state.transactions.filter(t => t.id !== id);
  await persist();
  render();
}

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function changeMonth(delta){
  state.viewDate.setMonth(state.viewDate.getMonth() + delta);
  state.viewDate = new Date(state.viewDate);
  render();
}
$('prev-month').onclick = () => changeMonth(-1);
$('next-month').onclick = () => changeMonth(1);

function render(){
  const mk = monthKey(state.viewDate);
  $('month-label').textContent = MONTHS[state.viewDate.getMonth()] + ' ' + state.viewDate.getFullYear();

  const monthTx = state.transactions.filter(t => t.date.slice(0,7) === mk);
  const income = monthTx.filter(t => t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = monthTx.filter(t => t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;
  const rate = income > 0 ? Math.max(0, Math.min(100, (balance/income)*100)) : 0;

  $('stat-income').textContent = fmt(income);
  $('stat-expense').textContent = fmt(expense);
  $('stat-balance').textContent = fmt(balance);
  $('stat-balance').className = 'val ' + (balance >= 0 ? 'income' : 'expense');

  const circumference = 351.86;
  const offset = circumference - (rate/100)*circumference;
  $('ring-fg').style.strokeDashoffset = offset;
  $('ring-fg').setAttribute('stroke', balance >= 0 ? '#2F6F52' : '#7C3A4D');
  $('ring-pct').textContent = Math.round(rate) + '%';

  const catTotals = {};
  monthTx.filter(t=>t.type==='expense').forEach(t => { catTotals[t.category] = (catTotals[t.category]||0) + t.amount; });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catWrap = $('cat-breakdown');
  catWrap.innerHTML = '';
  if(catEntries.length === 0){
    catWrap.innerHTML = '<p class="empty" style="padding:6px 0;">Sin gastos registrados este mes</p>';
  } else {
    const max = catEntries[0][1];
    catEntries.forEach(([cat, amt]) => {
      const div = document.createElement('div');
      div.className = 'cat-item';
      div.innerHTML = `<div class="cat-top"><span class="name">${cat}</span><span class="amt">${fmt(amt)}</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(amt/max)*100}%"></div></div>`;
      catWrap.appendChild(div);
    });
  }

  const hist = $('history');
  hist.innerHTML = '';
  if(monthTx.length === 0){
    hist.innerHTML = '<div class="empty"><span>Aún no hay movimientos</span>Agrega tu primer ingreso o gasto arriba</div>';
    return;
  }
  const byDay = {};
  monthTx.forEach(t => { (byDay[t.date] = byDay[t.date] || []).push(t); });
  Object.keys(byDay).sort((a,b)=>b.localeCompare(a)).forEach(day => {
    const d = new Date(day + 'T00:00:00');
    const label = document.createElement('div');
    label.className = 'day-label';
    label.textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    hist.appendChild(label);
    byDay[day].sort((a,b)=>0).forEach(t => {
      const row = document.createElement('div');
      row.className = 'tx';
      row.innerHTML = `
        <span class="tx-dot ${t.type}"></span>
        <div class="tx-mid">
          <div class="tx-cat">${t.category}</div>
          ${t.note ? `<div class="tx-note">${t.note}</div>` : ''}
        </div>
        <span class="tx-amt ${t.type}">${t.type==='income'?'+':'−'} ${fmt(t.amount)}</span>
        <button class="tx-del" aria-label="Eliminar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>`;
      row.querySelector('.tx-del').onclick = () => deleteTx(t.id);
      hist.appendChild(row);
    });
  });
}

setToday();
setType('income');
loadData();
</script>
</body>
</html>
